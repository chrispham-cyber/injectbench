# One command to run the whole dashboard:  docker compose up --build
#
# The frontend fetches the API from the browser at http://localhost:8000, so the
# backend port is published to the host. Saved runs are mounted in read-only;
# generating new runs still needs Ollama and is done on the host, not here.
services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - ./evals/results:/app/evals/results:ro

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    depends_on:
      - backend
