name: CI

# Regression gate: every push / PR must keep the tests green. The judge-
# validation tests (tests/test_judge_validation.py) enforce that the scorer
# never regresses -- no false positives, and only the documented blind spots
# may slip through -- so a change that weakens the measurement fails CI.
on:
  push:
  pull_request:

jobs:
  backend:
    name: backend (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Tests (judge, judge-validation, path-traversal)
        run: python -m pytest -q
      - name: Judge quality (informational)
        run: python -m scripts.validate_judge

  frontend:
    name: frontend (typecheck + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run build
